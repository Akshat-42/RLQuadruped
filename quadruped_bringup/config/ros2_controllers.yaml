controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_position_controller:
      type: position_controllers/JointGroupPositionController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

leg_position_controller:
  ros__parameters:
    joints:
      - fl_hip_joint
      - fl_thigh_joint
      - fl_knee_joint
      - fr_hip_joint
      - fr_thigh_joint
      - fr_knee_joint
      - rl_hip_joint
      - rl_thigh_joint
      - rl_knee_joint
      - rr_hip_joint
      - rr_thigh_joint
      - rr_knee_joint

imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
